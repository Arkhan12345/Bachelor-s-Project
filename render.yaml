services:
  - type: web
    name: arkhan-bachelor-project
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn --chdir App/webapp app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true